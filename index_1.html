<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O-NET Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap">
<style>
/* Siam Adventure theme — rice green, temple gold, river blue, brick red, cream */
:root{--rice:#7CB342;--rice2:#5E9A2C;--gold:#F2B705;--gold2:#C98F00;--river:#2B6CB0;--brick:#C8553D;--cream:#FFF6E0;--sand:#F2DDA6;--wood:#9A6B43;--ink:#3B2A1A;--muted:#7A6650;--line:#EED9A8;--bg:#EAF4E0;
  --good:#5E9A2C;--good-soft:#EAF7DA;--bad:#C8553D;--bad-soft:#FBE6E0;
  --display:"Mitr","Noto Sans Thai",system-ui,sans-serif;--body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;color-scheme:light}
html{font-size:16px}html.fz2{font-size:18.5px}html.fz3{font-size:21px}
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.06rem;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0,#F7FBEF 0,transparent 40%),radial-gradient(circle at 90% 100%,#DCEFC8 0,transparent 45%)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h2 small,h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.8em;margin-left:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--river);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:3px solid var(--line);box-shadow:0 2px 10px rgba(80,60,20,.08)}
.top .in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--river);white-space:nowrap}.logo span{color:var(--brick)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 12px 2px 5px;font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.stat svg{flex:none}
.me{display:inline-flex;align-items:center;gap:4px;font-family:var(--display)}
.ib{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 8px;font-family:var(--display);font-weight:600;color:var(--ink)}
.ib:hover{border-color:var(--gold)}
.fz{display:inline-flex;gap:4px}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
.note{font-size:.82rem;color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
/* frames & buttons */
.frame{background:#fff;border-radius:22px;box-shadow:0 7px 0 #CFE3BC,0 14px 30px rgba(60,80,30,.13);overflow:hidden}
.pad{padding:18px 20px}.col{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:500;font-size:1.05rem;background:var(--rice);color:#fff;box-shadow:0 4px 0 var(--rice2)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--rice2)}
.btn.ghost{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold2)}
.btn.blue{background:var(--river);box-shadow:0 4px 0 #1F4F86}
.btn.sm{padding:7px 14px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.subbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--cream);border-bottom:3px solid var(--line)}
.subbar h2{font-size:1.2rem;flex:1;min-width:0}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-family:var(--display)}
.chip small{color:var(--muted)}
.chip.on{border-color:var(--rice2);background:var(--good-soft)}
.stars{color:#E09A00;letter-spacing:2px}
.hint{margin:0 0 10px;color:var(--muted)}
/* home */
.hero{padding:26px 20px 18px;text-align:center;background:linear-gradient(#BFE3F7,#E3F3FC)}
.hero h1{font-size:2.2rem;font-weight:600;color:var(--river)}.hero h1 span{color:var(--brick)}
.hero p{margin:4px 0 0;font-family:var(--display);color:var(--wood)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.pick{border:3px solid transparent;background:#fff;border-radius:18px;padding:8px 8px 12px;font-family:var(--display);display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 #E6D3A6,0 0 0 2px var(--line) inset;transition:transform .15s}
.pick:hover{border-color:var(--gold);transform:translateY(-4px)}
.pick b{font-weight:500}.pick span{font-size:.8rem;color:var(--muted)}
.pinbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
input[type=password],select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
#spin{font-size:1.6rem;letter-spacing:.5em;width:9.5rem;text-align:center}
/* bubbles */
.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 18px;position:relative;min-width:0}
.bubble p{margin:0}.bubble .en{font-family:var(--display);font-size:1.15rem}.bubble .thx{color:var(--muted);margin-top:4px}
/* map */
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--cream);border-bottom:3px solid var(--line)}
.mapbar h2{font-size:1.3rem}
.mapsvg svg{display:block;width:100%;height:auto}
.mapsvg .bob{animation:bob 3.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.mapsvg .isle{cursor:pointer}.mapsvg .isle.locked{cursor:not-allowed}
.mapsvg .isle:not(.locked):hover .bob{filter:brightness(1.08)}
.mapsvg #boat{transition:transform 1.6s cubic-bezier(.45,.05,.35,1)}
.face{transition:transform .35s;transform-box:fill-box;transform-origin:center}
.rock{animation:rock 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 80%}
@keyframes rock{from{transform:rotate(-2.5deg) translateY(-2px)}to{transform:rotate(2.5deg) translateY(2px)}}
.spin{animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.flag{animation:flag 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes flag{from{transform:skewY(-6deg) scaleX(.94)}to{transform:skewY(6deg) scaleX(1)}}
.drift{animation:drift 9s linear infinite}@keyframes drift{to{transform:translateX(120px)}}
.glow{animation:glow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes glow{to{transform:scale(1.18);opacity:.12}}
.cloudA{animation:cloudA 26s ease-in-out infinite alternate}.cloudB{animation:cloudA 32s ease-in-out infinite alternate-reverse}@keyframes cloudA{to{transform:translateX(60px)}}
/* island page */
.banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:center;padding:14px 18px;background:linear-gradient(180deg,#BFE3F7 0,#E3F3FC 55%,#7CC4EC 55%,#3F8FCF 100%)}
.bisle svg{display:block;width:100%;height:auto}
.npc{display:flex;gap:10px;align-items:center}
.npcfig{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:.85rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);flex:none}
.npcfig svg{animation:hop 1.6s ease-in-out infinite alternate}
.npcfig b{background:rgba(59,42,26,.78);border-radius:99px;padding:1px 10px;font-weight:500;text-shadow:none;white-space:nowrap}
.npc .bubble:before{content:"";position:absolute;left:-16px;top:30px;border:9px solid transparent;border-right:14px solid var(--ink)}
.std{font-family:var(--display);color:var(--wood)}
.goalbox{background:var(--cream);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.goalbox b{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:500}
.goal{display:flex;gap:8px;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.lvl{position:relative;border:none;text-align:left;padding:16px 16px 14px;border-radius:16px;background:linear-gradient(#C99A62,#A87A45);color:#fff;box-shadow:0 5px 0 #7A5530;display:flex;flex-direction:column;gap:4px;font-family:var(--display)}
.lvl:before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,246,224,.5);border-radius:12px;pointer-events:none}
.lvl h3{font-size:1.25rem}.lvl .stars{color:#FFE27A;font-size:1.2rem}.lvl .note{color:#FFF1D6;font-family:var(--body)}
.lvl.on{background:linear-gradient(#8CC152,#5E9A2C);box-shadow:0 5px 0 #3F6E1C}
.lvl.locked{background:linear-gradient(#CFC6B5,#B5AB98);box-shadow:0 5px 0 #968C7A;cursor:default}
.lvl:not(.locked):hover{transform:translateY(-2px)}
/* question */
.dots{display:flex;gap:6px}.dots i{width:13px;height:13px;border-radius:50%;background:#E6D9BC;border:2px solid #fff}
.dots i.ok{background:var(--rice)}.dots i.no{background:var(--brick)}.dots i.cur{background:var(--gold);transform:scale(1.25)}
.q{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;padding:20px 20px 26px;overflow:hidden;background:linear-gradient(180deg,#BFE3F7 0,#E3F3FC 62%,#5DB3E6 62%,#3F8FCF 100%);position:relative}
.dock{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:200px}
.dock .water{position:absolute;bottom:-26px;left:-20px;width:calc(100% + 20px);height:110px}
.hero-c{position:relative;z-index:1;margin-bottom:34px;animation:hop 1.2s ease-in-out infinite alternate}
.hero-c.happy{animation:jump .5s ease-out 2}.hero-c.oops{animation:wobble .45s ease-in-out}
@keyframes hop{to{transform:translateY(-6px)}}@keyframes jump{50%{transform:translateY(-22px) rotate(-4deg)}}
@keyframes wobble{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.qb{align-self:center;display:flex;flex-direction:column;gap:6px}
.qb:before{content:"";position:absolute;left:-18px;top:44px;border:10px solid transparent;border-right:16px solid var(--ink)}
.qb .ctx{white-space:pre-line;font-size:1.15rem}.qb .ctx b{font-weight:600}
.qb .ask{font-family:var(--display);font-weight:500;font-size:1.3rem;color:var(--river)}
.pic img{display:block;max-width:360px;width:100%;height:auto;border-radius:12px;border:2px solid var(--line)}
.em{font-size:3rem;line-height:1}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listen{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;background:var(--river);color:#fff;font-family:var(--display);font-weight:500;font-size:1.1rem;padding:9px 20px 9px 14px;box-shadow:0 4px 0 #1F4F86}
.listen small{opacity:.85;font-size:.8em}
.listen.slow{background:#fff;color:var(--river);border:2px solid var(--river);box-shadow:none;padding:6px 14px;font-size:.95rem}
.listen.sm{font-size:.95rem;padding:6px 14px 6px 10px;margin-top:8px}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 #1F4F86}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px;background:var(--sand)}
.opt{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.12rem;background:#fff;border:3px solid #E2C98A;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #D9BC77;text-align:left;min-height:64px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.opt .k{flex:none;width:2.2rem;height:2.2rem;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600}
.k0{background:var(--rice2)}.k1{background:var(--river)}.k2{background:var(--brick)}.k3{background:#B0821B}
.opt.ok{border-color:var(--rice2);background:var(--good-soft);box-shadow:0 5px 0 var(--rice2)}
.opt.no{border-color:var(--brick);background:var(--bad-soft);box-shadow:0 5px 0 var(--brick);animation:shake .4s}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.no){opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;color:#fff;font-family:var(--display)}
.fb.ok{background:var(--rice)}.fb.no{background:var(--brick)}
.fb b{font-size:1.25rem}.fb .en{flex-basis:100%;font-family:var(--body);font-size:1.05rem}
.fb .tag{margin-left:auto;background:#fff;color:var(--ink);border-radius:99px;padding:3px 14px;font-weight:500}
.th{display:flex;gap:8px;align-items:flex-start;background:var(--cream);border-top:3px dashed var(--line);padding:12px 20px}
.thbtn{margin:10px 20px 0}
.next{padding:12px 20px 0}
.bar{height:14px;background:#E8DBBB;border-radius:99px;overflow:hidden;margin:14px 20px 18px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F7C948);transition:width .5s}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s linear forwards}
@keyframes fall{to{top:110%;transform:rotate(600deg)}}
/* results */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.bigstars{display:flex;gap:6px}.bigstars svg{width:56px;height:56px}
.chestbtn{border:none;background:none;padding:0;width:min(220px,100%);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);color:var(--wood)}
.chestbtn svg{width:100%;height:auto}
.chestbtn.shut svg{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-4deg)}86%{transform:rotate(4deg)}94%{transform:rotate(-2deg)}}
.chestbtn.open svg{animation:popin .45s ease-out}
@keyframes popin{from{transform:scale(.85)}to{transform:none}}
.gain{font-family:var(--display);font-size:1.6rem;color:var(--gold2);display:flex;align-items:center;gap:6px}
.msg{border-radius:14px;padding:10px 14px}.msg.ok{background:var(--good-soft)}.msg.no{background:var(--bad-soft)}
.feel{display:flex;gap:10px;flex-wrap:wrap}.feel button{border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 6px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:.85rem}
.feel button.on{border-color:var(--rice2);background:var(--good-soft)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.badge{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.badge b{font-family:var(--display);font-weight:500}.badge.off{background:#FAF7F0}
/* shop */
.shop{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;padding:18px 20px}
.preview{background:radial-gradient(circle at 50% 45%,#FFF6E0 0,#FBE9C2 70%);border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.preview svg{max-width:100%;height:auto}
.minis{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini{border:2px solid var(--line);background:#fff;border-radius:12px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;font-size:.7rem}
.mini.on{border-color:var(--gold);background:var(--cream)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.item{border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:#fff}
.item b{font-family:var(--display);font-weight:500}.item span{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.item.on{border-color:var(--rice2);background:var(--good-soft)}
/* tutorial */
.tut{position:fixed;inset:0;z-index:50;background:rgba(30,40,20,.55);display:grid;place-items:center;padding:16px}
.tbox{background:#fff;border-radius:24px;max-width:520px;width:100%;box-shadow:0 8px 0 #CFE3BC;overflow:hidden;max-height:calc(100vh - 32px);overflow-y:auto}
.tart{background:linear-gradient(#BFE3F7,#E3F3FC);display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:14px;min-height:150px}
.tart svg{max-width:100%;height:auto}
.tbody{padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px}
.tbody h2{font-size:1.35rem}.tbody p{margin:0}
.tdots{display:flex;gap:6px}.tdots i{width:10px;height:10px;border-radius:50%;background:#E6D9BC}.tdots i.on{background:var(--gold)}
/* teacher / expert */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.p1{background:var(--bad-soft);color:var(--bad)}.p2{background:#FDF0D3;color:var(--ink)}.p3{background:var(--good-soft);color:var(--good)}
.pop{animation:popf .35s ease-out}@keyframes popf{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:700px){
  .res>.col:last-child{order:-1}.top{position:static}.me>span,#sync{display:none}.top .in{padding:8px 12px}.wrap{padding:12px 10px 40px}
  .q{grid-template-columns:1fr;padding:14px}.dock{min-height:150px}.hero-c svg{width:120px;height:120px}
  .qb:before,.npc .bubble:before{display:none}.opts{grid-template-columns:1fr;padding:14px}
  .banner{grid-template-columns:1fr}.res{grid-template-columns:1fr}.shop{grid-template-columns:1fr}
  .npc{flex-direction:column;align-items:stretch}.npcfig{flex-direction:row;gap:8px}.npcfig svg{width:80px;height:80px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo">O-NET <span>Quest</span></div><div class="who" id="who"></div></div></header>
<div class="wrap"><main id="app"></main></div>

<script>
const SIAM=(function(){

const C = {
  ink: "#3B2A1A", blush: "#F49A8C", white: "#FFFFFF",
};
function eyes(x1, x2, y, mood) {
  if (mood === "happy") return `<path d="M${x1-5},${y} q5,-6 10,0" stroke="${C.ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${x2-5},${y} q5,-6 10,0" stroke="${C.ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  if (mood === "oops") return `<circle cx="${x1}" cy="${y}" r="4.2" fill="${C.ink}"/><circle cx="${x2}" cy="${y}" r="4.2" fill="${C.ink}"/><circle cx="${x1+1.5}" cy="${y-1.5}" r="1.4" fill="#fff"/><circle cx="${x2+1.5}" cy="${y-1.5}" r="1.4" fill="#fff"/>`;
  return `<ellipse cx="${x1}" cy="${y}" rx="4.6" ry="5.6" fill="${C.ink}"/><ellipse cx="${x2}" cy="${y}" rx="4.6" ry="5.6" fill="${C.ink}"/><circle cx="${x1+1.6}" cy="${y-2}" r="1.7" fill="#fff"/><circle cx="${x2+1.6}" cy="${y-2}" r="1.7" fill="#fff"/>`;
}
function mouth(x, y, mood) {
  if (mood === "happy") return `<path d="M${x-7},${y} q7,8 14,0" fill="#E2574C" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
  if (mood === "oops") return `<ellipse cx="${x}" cy="${y+2}" rx="3.2" ry="4" fill="${C.ink}"/>`;
  return `<path d="M${x-5},${y} q5,5 10,0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
}
const blush = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="6" ry="3.6" fill="${C.blush}" opacity=".75"/><ellipse cx="${x2}" cy="${y}" rx="6" ry="3.6" fill="${C.blush}" opacity=".75"/>`;


const sparkles = (pts) => pts.map(([x, y, s]) => `<path transform="translate(${x},${y}) scale(${s || 1})" d="M0,-6 l1.8,4.2 4.2,1.8 -4.2,1.8 -1.8,4.2 -1.8,-4.2 -4.2,-1.8 4.2,-1.8z" fill="#F2B705"/>`).join("");

  if (!wear) return "";
  const c = CHARS[key]; let o = "";
  ["neck", "hat"].forEach(slot => { const it = SHOP.find(s => s.k === wear[slot]); if (it) { const [x, y] = c[slot]; o += `<g transform="translate(${x},${y})">${it.draw()}</g>`; } });
  return o;
}
const charArt = (key, mood, wear) => (CHARS[key] || CHARS.elephant).draw(mood || "idle") + wearSVG(CHARS[key] ? key : "elephant", wear);
function charSVG(key, mood = "idle", size = 120, wear) {

function itemSVG(k, size = 70) {

}

function gsr(fn,args){if(typeof google==="undefined"||!google.script)return Promise.reject("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่");return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e.message:String(e)))[fn](...args)})}

 if(!API_URL||!useFetch||typeof fetch!=="function")return gsr(fn,args);

  .catch(e=>{if(e&&e.srv)throw e.srv;useFetch=false;return gsr(fn,args)})
}
function blankState(){return {xp:0,stats:{},ft:{},badges:[],wrong:[],codeCount:{},errTotal:{},fixits:0,streak3:0,thClicks:0,feel:{},coins:0,owned:[],wear:{},char:"",tutorialDone:false}}

/* ---------- progress logic (unchanged) ---------- */
function stat(p,isl,lv){return p.stats[isl+"-"+lv]||{last:[],best:0,played:0}}
function levelStatus(p,isl,lv){
  const st=stat(p,isl,lv), acc=st.last.length?st.last.reduce((a,b)=>a+b,0)/st.last.length:0;
  const passed=st.last.length>0&&acc>=0.8;
  const start=(p.start&&p.start[isl])||1;
  const unlocked=lv<=start||levelStatus(p,isl,lv-1).passed;
  return {passed,unlocked,best:st.best,played:st.played,acc};
}
function islandProgress(p,k){let n=0;for(const l of [1,2,3]) if(levelStatus(p,k,l).passed) n++;return n/3}

   <div class="row">${ISLANDS.filter(i=>isOpen(i.k)).map(i=>`<button class="chip" onclick="sail('${i.k}')">${i.name} <small>${i.th}</small> <span class="stars">${starStr(stars[i.k])}</span></button>`).join("")}</div></div></div>`;

}
function sail(k){
  if(sailing)return;
  const el=document.querySelector(`#mapsvg .isle[data-k="${k}"]`),bt=$("#boat");

  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!bt||!el||still||k===CUR){CUR=k;SFX.tap();return island(k)}
  sailing=true;SFX.sail();
  const cur=new DOMMatrix(getComputedStyle(bt).transform).e,tx=+el.dataset.x;
  bt.querySelector(".face").style.transform=tx>cur+5?"scaleX(-1)":"scaleX(1)";
  bt.style.transform=`translate(${tx}px,${el.dataset.y}px)`;
  CUR=k;setTimeout(()=>{if(SCREEN==="map")island(k);sailing=false},1700);
}

function startRound(k,l,fixCode){
  const p=P(); let pool;

  else{
    pool=shuffle(ITEMS.filter(i=>i.isl===k&&i.lv===l)).slice(0,ROUND);
    const review=p.wrong.map(id=>ITEMS.find(i=>i.id===id)).filter(i=>i&&i.isl===k&&!pool.includes(i));
    if(review.length&&pool.length>=ROUND){pool[ROUND-1]=review[Math.floor(Math.random()*review.length)];pool=shuffle(pool)}
  }
  S={...S,isl:k,lv:l,fix:fixCode||null,items:pool.map(it=>({it,ord:shuffle([0,1,2,3])})),i:0,ok:0,xp:0,coins:0,res:[]};

}

   <div class="row"><button class="btn" onclick="TPIN=$('#pin').value;teacher()">เข้าสู่หน้าครู</button><button class="link" onclick="home()">กลับ</button></div><span id="pinmsg" class="note"></span></div>`;
}
async function teacher(){
  let d; try{d=await call("teacherData",TPIN)}catch(e){const m=$("#pinmsg");if(m)m.textContent=e;else alertBox(e);return}
  header();
  const rows=d.players.map(pl=>{const p=Object.assign(blankState(),pl.state||{});p.start=pl.start;
    return `<tr><td>${esc(pl.id)}<div class="note">${esc(pl.name)}</div></td>${OPEN.map(k=>{
      const lvNow=[3,2,1].find(l=>levelStatus(p,k,l).unlocked)||1, passed=[1,2,3].filter(l=>levelStatus(p,k,l).passed).length;
      const f=p.ft[k], acc=f&&f.n?Math.round(100*f.ok/f.n)+"%":"–";
      return `<td><span class="pill p${lvNow}">${LV[lvNow]}</span><div class="note">ผ่าน ${passed}/3 · ถูก ${acc}</div>
        <select aria-label="ระดับเริ่ม ${k}" onchange="setStart('${esc(pl.id)}','${k}',this.value)">${[1,2,3].map(l=>`<option value="${l}" ${pl.start[k]==l?"selected":""}>เริ่มระดับ ${l}</option>`).join("")}</select></td>`}).join("")}
    <td>${p.xp}</td><td>${p.thClicks}</td></tr>`}).join("");
  const all={};d.players.forEach(pl=>{const e=(pl.state&&pl.state.errTotal)||{};for(const c in e)all[c]=(all[c]||0)+e[c]});
  const top=Object.entries(all).filter(([c])=>c!=="-").sort((a,b)=>b[1]-a[1]).slice(0,3);
  app.innerHTML=`<div class="col pop">
   <div class="row" style="justify-content:space-between"><h2>หน้าครู</h2><div class="row"><a class="link" href="${esc(d.url)}" target="_blank" rel="noopener">เปิด Google Sheet</a><button class="link" onclick="teacher()">รีเฟรช</button><button class="link" onclick="TPIN='';home()">ออก</button></div></div>
   <div class="card"><b>ข้อผิดพลาดที่พบบ่อยของทั้งชั้น (ใช้ในขั้น P)</b>
     <div style="margin-top:8px">${top.length?top.map(([c,v],i)=>`<div>${i+1}. <b>${c}</b> ${CODE_TH[c]||""} — ${v} ครั้ง</div>`).join(""):'<span class="note">ยังไม่มีข้อมูล ให้นักเรียนเล่นก่อน</span>'}</div></div>
   <div class="card tablewrap"><table><thead><tr><th>นักเรียน</th>${OPEN.map(k=>`<th>${ISLANDS.find(i=>i.k===k).name}</th>`).join("")}<th>XP</th><th>กดดูคำอธิบายไทย</th></tr></thead><tbody>${rows}</tbody></table>
   <p class="note">ระดับเริ่มตั้งจากผลทดสอบก่อนเรียน: ต่ำกว่า 50% = 1, 50–79% = 2, 80% ขึ้นไป = 3 · ข้อมูลทุกคำตอบอยู่ในแท็บ "บันทึกคำตอบ" ของ Google Sheet · เหรียญและชุดไทยเป็นของตกแต่ง ไม่มีผลต่อระดับ</p></div>
   <div class="card col" style="gap:8px"><b>ทดสอบเสียงบนเครื่องนี้</b>
     <div class="row"><button class="btn ghost" onclick="voiceTest()">${ICON.soundOn} ทดสอบเสียงอ่าน</button></div><div id="vt" class="note"></div></div></div>`;
}
async function setStart(id,k,v){try{await call("setStart",TPIN,id,k,+v)}catch(e){alertBox(e)}}
function alertBox(t){const d=document.createElement("div");d.className="msg no";d.textContent=String(t);app.prepend(d);setTimeout(()=>d.remove(),5000)}

/* ---------- read aloud (Web Speech API) ---------- */
function sayMsg(t,sel){const m=$(sel||"#saymsg");if(m)m.textContent=t}
function getVoices(){return new Promise(res=>{let v=[];try{v=speechSynthesis.getVoices()}catch(e){}
  if(v.length)return res(v);let done=false;const fin=()=>{if(done)return;done=true;let w=[];try{w=speechSynthesis.getVoices()}catch(e){}res(w)};
  try{speechSynthesis.addEventListener("voiceschanged",fin,{once:true})}catch(e){}setTimeout(fin,1500)})}
function say(rate){const it=S.items[S.i].it;speak((it.ctx+". "+it.q).replace(/_+/g,"blank").replace(/\n/g,". "),rate||.85,"#saymsg")}
async function speak(text,rate,sel){
  if(!("speechSynthesis" in window)){sayMsg("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง ลองเปิดเกมใน Google Chrome หรือ Microsoft Edge",sel);return}
  sayMsg("กำลังโหลดเสียง…",sel);
  const voices=await getVoices();
  const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!voices.length){sayMsg("เครื่องนี้ยังไม่มีเสียงสำหรับอ่านออกเสียง ลองเปิดใน Google Chrome หรือติดตั้งเสียงภาษาอังกฤษในการตั้งค่าเครื่อง",sel);return}
  if(!en.length){sayMsg("เครื่องนี้ไม่มีเสียงภาษาอังกฤษ ติดตั้งได้ที่ การตั้งค่า > เวลาและภาษา > เสียงพูด (Speech)",sel);return}
  const voice=en.find(v=>/en-US/i.test(v.lang)&&/Google|Natural|Online/i.test(v.name))||en.find(v=>/en-US/i.test(v.lang))||en[0];
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=rate||.85;u.volume=1;
      u.onstart=()=>sayMsg("กำลังอ่าน…",sel);u.onend=()=>sayMsg("",sel);
      u.onerror=e=>sayMsg("อ่านออกเสียงไม่ได้ ("+(e.error||"error")+") ลองเปิดเกมใน Google Chrome",sel);
      try{speechSynthesis.resume()}catch(e){}
      speechSynthesis.speak(u);
      setTimeout(()=>{const m=$(sel);if(!speechSynthesis.speaking&&m&&/โหลด/.test(m.textContent))sayMsg("ไม่มีเสียงออก ลองเช็กว่าเปิดลำโพงอยู่ หรือเปิดเกมใน Google Chrome",sel)},2500);
    },120);
  }catch(e){sayMsg("อ่านออกเสียงไม่ได้ ลองเปิดเกมใน Google Chrome",sel)}
}
async function voiceTest(){
  const out=$("#vt");
  if(!("speechSynthesis" in window)){out.textContent="เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง";return}
  out.textContent="กำลังตรวจ…";const v=await getVoices();const en=v.filter(x=>/^en(-|_|$)/i.test(x.lang));
  out.innerHTML=`เสียงทั้งหมด ${v.length} เสียง · เสียงอังกฤษ ${en.length} เสียง${en.length?": "+esc(en.slice(0,4).map(x=>x.name).join(", ")):""}<br>${v.length&&en.length?"เครื่องนี้พร้อมอ่านออกเสียง กำลังลองพูด Hello, students!":"เครื่องนี้ยังไม่มีเสียงภาษาอังกฤษ"}`;
  if(en.length){try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance("Hello, students!");u.voice=en.find(x=>/en-US/i.test(x.lang))||en[0];u.lang=u.voice.lang;speechSynthesis.speak(u)},120)}catch(e){}}
}

boot();
