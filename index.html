<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O-NET Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap">
<style>
/* Siam Adventure theme — rice green, temple gold, river blue, brick red, cream */
:root{--rice:#7CB342;--rice2:#5E9A2C;--gold:#F2B705;--gold2:#C98F00;--river:#2B6CB0;--brick:#C8553D;--cream:#FFF6E0;--sand:#F2DDA6;--wood:#9A6B43;--ink:#3B2A1A;--muted:#7A6650;--line:#EED9A8;--bg:#EAF4E0;
  --good:#5E9A2C;--good-soft:#EAF7DA;--bad:#C8553D;--bad-soft:#FBE6E0;
  --display:"Mitr","Noto Sans Thai",system-ui,sans-serif;--body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;color-scheme:light}
html{font-size:16px}html.fz2{font-size:18.5px}html.fz3{font-size:21px}
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.06rem;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0,#F7FBEF 0,transparent 40%),radial-gradient(circle at 90% 100%,#DCEFC8 0,transparent 45%)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h2 small,h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.8em;margin-left:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--river);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:3px solid var(--line);box-shadow:0 2px 10px rgba(80,60,20,.08)}
.top .in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--river);white-space:nowrap}.logo span{color:var(--brick)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 12px 2px 5px;font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.stat svg{flex:none}
.me{display:inline-flex;align-items:center;gap:4px;font-family:var(--display)}
.ib{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 8px;font-family:var(--display);font-weight:600;color:var(--ink)}
.ib:hover{border-color:var(--gold)}
.fz{display:inline-flex;gap:4px}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
.note{font-size:.82rem;color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
/* frames & buttons */
.frame{background:#fff;border-radius:22px;box-shadow:0 7px 0 #CFE3BC,0 14px 30px rgba(60,80,30,.13);overflow:hidden}
.pad{padding:18px 20px}.col{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:500;font-size:1.05rem;background:var(--rice);color:#fff;box-shadow:0 4px 0 var(--rice2)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--rice2)}
.btn.ghost{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold2)}
.btn.blue{background:var(--river);box-shadow:0 4px 0 #1F4F86}
.btn.sm{padding:7px 14px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.subbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--cream);border-bottom:3px solid var(--line)}
.subbar h2{font-size:1.2rem;flex:1;min-width:0}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-family:var(--display)}
.chip small{color:var(--muted)}
.chip.on{border-color:var(--rice2);background:var(--good-soft)}
.stars{color:#E09A00;letter-spacing:2px}
.hint{margin:0 0 10px;color:var(--muted)}
/* home */
.hero{padding:26px 20px 18px;text-align:center;background:linear-gradient(#BFE3F7,#E3F3FC)}
.hero h1{font-size:2.2rem;font-weight:600;color:var(--river)}.hero h1 span{color:var(--brick)}
.hero p{margin:4px 0 0;font-family:var(--display);color:var(--wood)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.pick{border:3px solid transparent;background:#fff;border-radius:18px;padding:8px 8px 12px;font-family:var(--display);display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 #E6D3A6,0 0 0 2px var(--line) inset;transition:transform .15s}
.pick:hover{border-color:var(--gold);transform:translateY(-4px)}
.pick b{font-weight:500}.pick span{font-size:.8rem;color:var(--muted)}
.pinbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
input[type=password],select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
#spin{font-size:1.6rem;letter-spacing:.5em;width:9.5rem;text-align:center}
/* bubbles */
.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 18px;position:relative;min-width:0}
.bubble p{margin:0}.bubble .en{font-family:var(--display);font-size:1.15rem}.bubble .thx{color:var(--muted);margin-top:4px}
/* map */
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--cream);border-bottom:3px solid var(--line)}
.mapbar h2{font-size:1.3rem}
.mapsvg svg{display:block;width:100%;height:auto}
.mapsvg .bob{animation:bob 3.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.mapsvg .isle{cursor:pointer}.mapsvg .isle.locked{cursor:not-allowed}
.mapsvg .isle:not(.locked):hover .bob{filter:brightness(1.08)}
.mapsvg #boat{transition:transform 1.6s cubic-bezier(.45,.05,.35,1)}
.face{transition:transform .35s;transform-box:fill-box;transform-origin:center}
.rock{animation:rock 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 80%}
@keyframes rock{from{transform:rotate(-2.5deg) translateY(-2px)}to{transform:rotate(2.5deg) translateY(2px)}}
.spin{animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.flag{animation:flag 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes flag{from{transform:skewY(-6deg) scaleX(.94)}to{transform:skewY(6deg) scaleX(1)}}
.drift{animation:drift 9s linear infinite}@keyframes drift{to{transform:translateX(120px)}}
.glow{animation:glow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes glow{to{transform:scale(1.18);opacity:.12}}
.cloudA{animation:cloudA 26s ease-in-out infinite alternate}.cloudB{animation:cloudA 32s ease-in-out infinite alternate-reverse}@keyframes cloudA{to{transform:translateX(60px)}}
/* island page */
.banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:center;padding:14px 18px;background:linear-gradient(180deg,#BFE3F7 0,#E3F3FC 55%,#36B8F7 55%,#1F94E6 100%)}
.bisle svg{display:block;width:100%;height:auto}
.npc{display:flex;gap:10px;align-items:center}
.npcfig{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:.85rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);flex:none}
.npcfig svg{animation:hop 1.6s ease-in-out infinite alternate}
.npcfig b{background:rgba(59,42,26,.78);border-radius:99px;padding:1px 10px;font-weight:500;text-shadow:none;white-space:nowrap}
.npc .bubble:before{content:"";position:absolute;left:-16px;top:30px;border:9px solid transparent;border-right:14px solid var(--ink)}
.std{font-family:var(--display);color:var(--wood)}
.goalbox{background:var(--cream);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.goalbox b{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:500}
.goal{display:flex;gap:8px;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.lvl{position:relative;border:none;text-align:left;padding:16px 16px 14px;border-radius:16px;background:linear-gradient(#C99A62,#A87A45);color:#fff;box-shadow:0 5px 0 #7A5530;display:flex;flex-direction:column;gap:4px;font-family:var(--display)}
.lvl:before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,246,224,.5);border-radius:12px;pointer-events:none}
.lvl h3{font-size:1.25rem}.lvl .stars{color:#FFE27A;font-size:1.2rem}.lvl .note{color:#FFF1D6;font-family:var(--body)}
.lvl.on{background:linear-gradient(#8CC152,#5E9A2C);box-shadow:0 5px 0 #3F6E1C}
.lvl.locked{background:linear-gradient(#CFC6B5,#B5AB98);box-shadow:0 5px 0 #968C7A;cursor:default}
.lvl:not(.locked):hover{transform:translateY(-2px)}
/* question */
.dots{display:flex;gap:6px}.dots i{width:13px;height:13px;border-radius:50%;background:#E6D9BC;border:2px solid #fff}
.dots i.ok{background:var(--rice)}.dots i.no{background:var(--brick)}.dots i.cur{background:var(--gold);transform:scale(1.25)}
.q{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;padding:20px 20px 26px;overflow:hidden;background:linear-gradient(180deg,#BFE3F7 0,#E3F3FC 62%,#36B8F7 62%,#1F94E6 100%);position:relative}
.dock{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:200px}
.dock .water{position:absolute;bottom:-26px;left:-20px;width:calc(100% + 20px);height:110px}
.hero-c{position:relative;z-index:1;margin-bottom:34px;animation:hop 1.2s ease-in-out infinite alternate}
.hero-c.happy{animation:jump .5s ease-out 2}.hero-c.oops{animation:wobble .45s ease-in-out}
@keyframes hop{to{transform:translateY(-6px)}}@keyframes jump{50%{transform:translateY(-22px) rotate(-4deg)}}
@keyframes wobble{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.qb{align-self:center;display:flex;flex-direction:column;gap:6px}
.qb:before{content:"";position:absolute;left:-18px;top:44px;border:10px solid transparent;border-right:16px solid var(--ink)}
.qb .ctx{white-space:pre-line;font-size:1.15rem}.qb .ctx b{font-weight:600}
.qb .ask{font-family:var(--display);font-weight:500;font-size:1.3rem;color:var(--river)}
.pic img{display:block;max-width:360px;width:100%;height:auto;border-radius:12px;border:2px solid var(--line)}
.em{font-size:3rem;line-height:1}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listen{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;background:var(--river);color:#fff;font-family:var(--display);font-weight:500;font-size:1.1rem;padding:9px 20px 9px 14px;box-shadow:0 4px 0 #1F4F86}
.listen small{opacity:.85;font-size:.8em}
.listen.slow{background:#fff;color:var(--river);border:2px solid var(--river);box-shadow:none;padding:6px 14px;font-size:.95rem}
.listen.sm{font-size:.95rem;padding:6px 14px 6px 10px;margin-top:8px}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 #1F4F86}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px;background:var(--sand)}
.opt{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.12rem;background:#fff;border:3px solid #E2C98A;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #D9BC77;text-align:left;min-height:64px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.opt .k{flex:none;width:2.2rem;height:2.2rem;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600}
.k0{background:var(--rice2)}.k1{background:var(--river)}.k2{background:var(--brick)}.k3{background:#B0821B}
.opt.ok{border-color:var(--rice2);background:var(--good-soft);box-shadow:0 5px 0 var(--rice2)}
.opt.no{border-color:var(--brick);background:var(--bad-soft);box-shadow:0 5px 0 var(--brick);animation:shake .4s}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.no){opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;color:#fff;font-family:var(--display)}
.fb.ok{background:var(--rice)}.fb.no{background:var(--brick)}
.fb b{font-size:1.25rem}.fb .en{flex-basis:100%;font-family:var(--body);font-size:1.05rem}
.fb .tag{margin-left:auto;background:#fff;color:var(--ink);border-radius:99px;padding:3px 14px;font-weight:500}
.th{display:flex;gap:8px;align-items:flex-start;background:var(--cream);border-top:3px dashed var(--line);padding:12px 20px}
.thbtn{margin:10px 20px 0}
.next{padding:12px 20px 0}
.bar{height:14px;background:#E8DBBB;border-radius:99px;overflow:hidden;margin:14px 20px 18px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F7C948);transition:width .5s}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s linear forwards}
@keyframes fall{to{top:110%;transform:rotate(600deg)}}
/* results */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.bigstars{display:flex;gap:6px}.bigstars svg{width:56px;height:56px}
.chestbtn{border:none;background:none;padding:0;width:min(220px,100%);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);color:var(--wood)}
.chestbtn svg{width:100%;height:auto}
.chestbtn.shut svg{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-4deg)}86%{transform:rotate(4deg)}94%{transform:rotate(-2deg)}}
.chestbtn.open svg{animation:popin .45s ease-out}
@keyframes popin{from{transform:scale(.85)}to{transform:none}}
.gain{font-family:var(--display);font-size:1.6rem;color:var(--gold2);display:flex;align-items:center;gap:6px}
.msg{border-radius:14px;padding:10px 14px}.msg.ok{background:var(--good-soft)}.msg.no{background:var(--bad-soft)}
.feel{display:flex;gap:10px;flex-wrap:wrap}.feel button{border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 6px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:.85rem}
.feel button.on{border-color:var(--rice2);background:var(--good-soft)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.badge{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.badge b{font-family:var(--display);font-weight:500}.badge.off{background:#FAF7F0}
/* shop */
.shop{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;padding:18px 20px}
.preview{background:radial-gradient(circle at 50% 45%,#FFF6E0 0,#FBE9C2 70%);border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.preview svg{max-width:100%;height:auto}
.minis{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini{border:2px solid var(--line);background:#fff;border-radius:12px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;font-size:.7rem}
.mini.on{border-color:var(--gold);background:var(--cream)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.item{border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:#fff}
.item b{font-family:var(--display);font-weight:500}.item span{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.item.on{border-color:var(--rice2);background:var(--good-soft)}
/* tutorial */
.tut{position:fixed;top:0;left:0;right:0;bottom:0;min-height:100vh;min-height:100lvh;z-index:50;background:rgba(30,40,20,.55);display:grid;place-items:center;padding:16px}
.tbox{background:#fff;border-radius:24px;max-width:520px;width:100%;box-shadow:0 8px 0 #CFE3BC;overflow:hidden;max-height:calc(100vh - 32px);overflow-y:auto}
.tart{background:linear-gradient(#BFE3F7,#E3F3FC);display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:14px;min-height:150px}
.tart svg{max-width:100%;height:auto}
.tbody{padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px}
.tbody h2{font-size:1.35rem}.tbody p{margin:0}
.tdots{display:flex;gap:6px}.tdots i{width:10px;height:10px;border-radius:50%;background:#E6D9BC}.tdots i.on{background:var(--gold)}
.kruhi{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:10px;text-align:left}
.kruhi .bubble{max-width:420px}.kruhi svg{flex:none}
.kruguide{display:flex;flex-direction:column;align-items:center;font-family:var(--display);color:var(--brick);font-size:.85rem;margin-right:auto}
@media (max-width:700px){.kruhi{flex-direction:column;align-items:center}.kruguide svg{width:84px;height:84px}}
.loginbox{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto;width:100%}
.loginbox input{font:inherit;font-size:1.15rem;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:#fff}
.giftbtn{border:none;background:none;padding:0;animation:wiggle 1.4s ease-in-out infinite}.giftbtn.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,1px) rotate(-3deg)}75%{transform:translate(4px,-1px) rotate(3deg)}}
.boxopen{position:relative;width:220px;height:206px}.boxhero{position:absolute;left:25px;top:-30px;animation:rise .7s ease-out}
@keyframes rise{from{transform:translateY(70px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.lidfly{animation:lid .6s ease-out forwards}@keyframes lid{to{transform:translate(40px,-30px) rotate(25deg)}}
.mini.lockd{opacity:.95}.mini.lockd:disabled{opacity:.5;cursor:default}
/* rewards */
.rew{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
.rewrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.rewrow svg{flex:none}
.bottle{border:3px dashed #3BA9E0;background:#E3F5FF;border-radius:18px;display:flex;align-items:center;gap:8px;padding:6px 12px;font-family:var(--display);color:#1F6FA8;animation:bob2 1.6s ease-in-out infinite alternate}
@keyframes bob2{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(2deg)}}
.bbox{max-width:560px}.bhead{display:flex;justify-content:space-between;padding:10px 18px;font-family:var(--display)}
.btimer{height:8px;background:#EEE}.btimer i{display:block;height:100%;background:linear-gradient(90deg,#FF9640,#FFC928);transition:width .25s linear}
.ben{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.3rem}
.fishes{display:flex;flex-direction:column;gap:8px}
.fish{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;text-align:left;font-size:1.05rem}
.fish.swim{animation:swim 2.4s ease-in-out infinite alternate}@keyframes swim{from{transform:translateX(0)}to{transform:translateX(14px)}}
.fish.ok,.tile.ok{border-color:var(--good);background:var(--good-soft)}.fish.no{border-color:var(--bad);background:var(--bad-soft)}
.tiles,.arrline{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}.arrline{border-bottom:3px dashed var(--line);padding-bottom:6px}
.tile{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:1.05rem}.tile:disabled{opacity:.35}.tile.on{opacity:1;background:var(--cream);border-color:var(--gold)}
.tierbtn{display:flex;align-items:center;gap:10px;border:3px solid;background:#fff;border-radius:16px;padding:6px 12px;text-align:left}
.pz{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--cream);border-radius:16px;padding:10px 14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.hcard{position:relative;border:3px solid var(--line);border-radius:16px;background:#fff;padding:18px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display)}

<div class="wrap"><main id="app"></main></div>

<script>
const SIAM=(function(){

const C = {
  ink: "#3B2A1A", blush: "#F49A8C", white: "#FFFFFF",
};
function eyes(x1, x2, y, mood) {
  if (mood === "happy") return `<path d="M${x1-5},${y} q5,-6 10,0" stroke="${C.ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${x2-5},${y} q5,-6 10,0" stroke="${C.ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  if (mood === "oops") return `<circle cx="${x1}" cy="${y}" r="4.2" fill="${C.ink}"/><circle cx="${x2}" cy="${y}" r="4.2" fill="${C.ink}"/><circle cx="${x1+1.5}" cy="${y-1.5}" r="1.4" fill="#fff"/><circle cx="${x2+1.5}" cy="${y-1.5}" r="1.4" fill="#fff"/>`;
  return `<ellipse cx="${x1}" cy="${y}" rx="4.6" ry="5.6" fill="${C.ink}"/><ellipse cx="${x2}" cy="${y}" rx="4.6" ry="5.6" fill="${C.ink}"/><circle cx="${x1+1.6}" cy="${y-2}" r="1.7" fill="#fff"/><circle cx="${x2+1.6}" cy="${y-2}" r="1.7" fill="#fff"/>`;
}
function mouth(x, y, mood) {
  if (mood === "happy") return `<path d="M${x-7},${y} q7,8 14,0" fill="#E2574C" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
  if (mood === "oops") return `<ellipse cx="${x}" cy="${y+2}" rx="3.2" ry="4" fill="${C.ink}"/>`;
  return `<path d="M${x-5},${y} q5,5 10,0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
}
const blush = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="6" ry="3.6" fill="${C.blush}" opacity=".75"/><ellipse cx="${x2}" cy="${y}" rx="6" ry="3.6" fill="${C.blush}" opacity=".75"/>`;

const K = { ink: "#2B2340", white: "#FFFFFF", blush: "#FF7E9E" };
let __u = 0;
const uid = (p) => p + (++__u);
function ball(cx, cy, r, base, shade, light) {
  const id = uid("c");
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r}" fill="${shade}"/><g clip-path="url(#${id})"><circle cx="${cx - r * .17}" cy="${cy - r * .19}" r="${r * .96}" fill="${base}"/></g>
  ${light ? `<ellipse cx="${cx - r * .42}" cy="${cy - r * .5}" rx="${r * .22}" ry="${r * .13}" fill="${light}" transform="rotate(-30 ${cx - r * .42} ${cy - r * .5})"/>` : ""}`;
}
function shp(d, base, shade, shadeD) {
  const id = uid("b");
  return `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${base}"/><g clip-path="url(#${id})"><path d="${shadeD}" fill="${shade}"/></g>`;
}
function eyes2(x1, x2, y, m, s = 1) {
  if (m === "happy") return [x1, x2].map(x => `<path d="M${x - 6 * s},${y + 1} q${6 * s},${-10 * s} ${12 * s},0 q${-6 * s},${-5 * s} ${-12 * s},0z" fill="${K.ink}"/>`).join("");
  if (m === "oops") return [x1, x2].map(x => `<circle cx="${x}" cy="${y}" r="${6.5 * s}" fill="#fff"/><circle cx="${x}" cy="${y + 1}" r="${2.6 * s}" fill="${K.ink}"/>`).join("") + `<path d="M${x2 + 9},${y - 10} q4,6 0,9 q-4,-3 0,-9z" fill="#5EC8FF"/>`;
  return [x1, x2].map(x => `<ellipse cx="${x}" cy="${y}" rx="${6 * s}" ry="${7 * s}" fill="#fff"/><ellipse cx="${x + 1}" cy="${y + 1}" rx="${4 * s}" ry="${4.8 * s}" fill="${K.ink}"/><circle cx="${x + 2.6 * s}" cy="${y - 1.6 * s}" r="${1.6 * s}" fill="#fff"/>`).join("");
}
function mouth2(x, y, m) {
  if (m === "happy") return `<path d="M${x - 8},${y} h16 q0,10 -8,10 q-8,0 -8,-10z" fill="#7A1F3D"/><path d="M${x - 4.5},${y + 7} q4.5,-4 9,0 q-4.5,3 -9,0z" fill="#FF7A8A"/>`;
  if (m === "oops") return `<ellipse cx="${x}" cy="${y + 3}" rx="3.6" ry="4.4" fill="#7A1F3D"/>`;
  return `<path d="M${x - 5},${y} q5,6 10,0 q-5,2.5 -10,0z" fill="#7A1F3D"/>`;
}
const cheeks = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="5.5" ry="3.4" fill="${K.blush}" opacity=".7"/><ellipse cx="${x2}" cy="${y}" rx="5.5" ry="3.4" fill="${K.blush}" opacity=".7"/>`;
const spark = (pts) => pts.map(([x, y, s]) => `<path transform="translate(${x},${y}) scale(${s || 1})" d="M0,-7 q1.2,5.8 7,7 q-5.8,1.2 -7,7 q-1.2,-5.8 -7,-7 q5.8,-1.2 7,-7z" fill="#FFD23F"/>`).join("");
const ground = (rx = 30) => `<ellipse cx="60" cy="106" rx="${rx}" ry="5" fill="#2B2340" opacity=".14"/>`;

const CHARS2 = {
  elephant: { name: "Elephant", th: "ช้าง", hat: [60, 24], neck: [60, 84], draw: (m) => {
    const B = "#62A8FF", S = "#3F84E0", L = "#A9D3FF";
    const earL = `<g transform="rotate(${m === "happy" ? -14 : 0} 20 56)">${shp("M20,30 a20,25 0 1 0 0.1,0z", B, S, "M-4,58 q24,18 48,0 v30 h-48z")}<ellipse cx="22" cy="57" rx="12" ry="15" fill="#FF9EC0"/><ellipse cx="25" cy="62" rx="8" ry="10" fill="#F57FA8"/></g>`;
    const earR = `<g transform="rotate(${m === "happy" ? 14 : 0} 100 56)">${shp("M100,30 a20,25 0 1 0 0.1,0z", B, S, "M76,58 q24,18 48,0 v30 h-48z")}<ellipse cx="98" cy="57" rx="12" ry="15" fill="#FF9EC0"/><ellipse cx="95" cy="62" rx="8" ry="10" fill="#F57FA8"/></g>`;
    const trunk = m === "happy" ? "M60,64 q12,-2 20,-14 q8,-12 6,-28" : m === "oops" ? "M60,64 q0,14 -1,24 q0,6 4,7" : "M60,64 q-2,14 6,22 q6,5 10,-1";
    const tip = m === "happy" ? `<ellipse cx="86" cy="21" rx="7" ry="4.6" fill="${L}"/><ellipse cx="86" cy="20.5" rx="2.8" ry="1.4" fill="${S}"/>` : "";
    const mo = m === "happy" ? mouth2(60, 72, m) : m === "oops" ? `<ellipse cx="46" cy="78" rx="3.4" ry="4.2" fill="#7A1F3D"/>` : `<path d="M41,76 q5,6 11,1 q-5,2 -11,-1z" fill="#7A1F3D"/>`;
    return `${ground()}${earL}${earR}${shp("M34,91 a13,13 0 0 1 13,-13 h26 a13,13 0 0 1 13,13 v1 a13,13 0 0 1 -13,13 h-26 a13,13 0 0 1 -13,-13z", B, S, "M60,78 h40 v30 h-40z")}
    ${ball(60, 54, 33, B, S, L)}${mo}
    <path d="${trunk}" fill="none" stroke="${S}" stroke-width="14" stroke-linecap="round"/><path d="${trunk}" fill="none" stroke="${B}" stroke-width="10" stroke-linecap="round" transform="translate(-1.5,-1.5)"/>${tip}
    ${eyes2(44, 76, 47, m)}${cheeks(36, 84, 61)}${m === "happy" ? spark([[104, 12], [112, 32, .6]]) : ""}
    <path d="M44,19 q16,-13 32,0 q-16,7 -32,0z" fill="#FFC928"/><path d="M60,22 q16,-1 16,-3 q-16,7 -32,0 q8,3 16,3z" fill="#F0A400"/><circle cx="60" cy="13" r="4.2" fill="#FF4F5E"/>`;
  } },
  buffalo: { name: "Buffalo", th: "ควาย", hat: [60, 26], neck: [60, 87], draw: (m) => {
    const B = "#6E7AA8", S = "#4F5A86", L = "#97A2CC";
    const hornL = m === "happy" ? "M30,36 q-26,-14 -16,-34 q4,16 24,22z" : m === "oops" ? "M26,44 q-24,0 -22,-20 q8,12 24,12z" : "M26,40 q-22,-6 -18,-28 q8,14 26,16z";
    const hornR = m === "happy" ? "M90,36 q26,-14 16,-34 q-4,16 -24,22z" : m === "oops" ? "M94,44 q24,0 22,-20 q-8,12 -24,12z" : "M94,40 q22,-6 18,-28 q-8,14 -26,16z";
    const ear = m === "oops" ? [24, 60, -40] : [22, 52, -20];

/* stepping stones between islands (skips islands and their name labels) */
function stonesPath(route, pos, ctrl) {
  const inIsle = (px, py) => Object.values(pos).some(([x, y]) => ((px - x) / 138) ** 2 + ((py - y) / 96) ** 2 < 1 || (Math.abs(px - x) < 100 && py > y + 74 && py < y + 152));
  let o = "", k = 0;
  for (let i = 0; i < route.length - 1; i++) {
    const [ax, ay] = pos[route[i]], [bx, by] = pos[route[i + 1]], [cx, cy] = ctrl[i];
    for (let t = 0; t <= 1; t += .045) {
      const px = (1 - t) ** 2 * ax + 2 * (1 - t) * t * cx + t * t * bx, py = (1 - t) ** 2 * ay + 2 * (1 - t) * t * cy + t * t * by;
      if (inIsle(px, py)) continue;
      k++; const r = 7 + (k % 3) * 1.5;
      o += `<g transform="translate(${px.toFixed(1)},${py.toFixed(1)})"><ellipse cy="3" rx="${r + 3}" ry="${r * .55 + 2}" fill="#9BE8FF" opacity=".55"/><ellipse cy="1.5" rx="${r}" ry="${r * .62}" fill="#9C6B3E"/><ellipse rx="${r}" ry="${r * .55}" fill="#C98E52"/><ellipse cx="${-r * .3}" cy="${-r * .2}" rx="${r * .4}" ry="${r * .2}" fill="#E7B47C"/></g>`;
    }
  }
  return o;
}

  <radialGradient id="seaGlow" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#7EC3EE" stop-opacity=".55"/><stop offset="1" stop-color="#1F5C9E" stop-opacity="0"/></radialGradient>
  <pattern id="waves" width="120" height="60" patternUnits="userSpaceOnUse"><path d="M8,22 q10,-7 20,0 t20,0" stroke="#fff" stroke-width="2.2" fill="none" opacity=".30"/><path d="M68,48 q8,-6 16,0 t16,0" stroke="#fff" stroke-width="1.8" fill="none" opacity=".22"/><circle cx="100" cy="14" r="1.6" fill="#fff" opacity=".5"/></pattern></defs>
  <rect width="1000" height="640" fill="url(#sea)"/><rect width="1000" height="640" fill="url(#seaGlow)"/><rect class="drift" x="-120" width="1240" height="640" fill="url(#waves)"/>
  <g transform="translate(940,52)"><circle class="glow" r="40" fill="#FFD54F" opacity=".25"/><circle r="30" fill="#FFD54F"/></g>
  <g class="cloudA">${cloud(40, 40, 1, .9)}</g><g class="cloudB">${cloud(640, 30, .7, .85)}</g>
  ${islet(345, 300, 1.1, "palm")}${islet(650, 300, .9, "rock")}${islet(960, 600, .8, "palm")}${islet(40, 600, .7, "rock")}
  ${turtle(640, 600)}${dolphin(360, 610)}${bottleSea(110, 315)}${bottleSea(900, 320)}
  ${stonesPath(route, pos, ctrl)}`;
  for (const k of route) {

  return `<svg viewBox="0 0 1000 640"><defs><filter id="gray"><feColorMatrix type="saturate" values=".35"/></filter></defs>${g}</svg>`;
}

/* ---------- progress logic (unchanged) ---------- */
function stat(p,isl,lv){return p.stats[isl+"-"+lv]||{last:[],best:0,played:0}}
function levelStatus(p,isl,lv){
  const st=stat(p,isl,lv), acc=st.last.length?st.last.reduce((a,b)=>a+b,0)/st.last.length:0;
  const passed=st.last.length>0&&acc>=0.8;
  const start=(p.start&&p.start[isl])||1;
  const unlocked=lv<=start||levelStatus(p,isl,lv-1).passed;
  return {passed,unlocked,best:st.best,played:st.played,acc};
}
function islandProgress(p,k){let n=0;for(const l of [1,2,3]) if(levelStatus(p,k,l).passed) n++;return n/3}
const hasItems=k=>ITEMS.some(x=>x.isl===k);
/* islands open one at a time: the teacher's open list, in map order; the next one opens after passing CFG.unlock on the one before */
const seqIsles=()=>ISLANDS.map(i=>i.k).filter(k=>OPEN.includes(k)&&hasItems(k));
function unlockLv(k){let L=Math.min(3,Math.max(1,+CFG.unlock||2));while(L>1&&!ITEMS.some(x=>x.isl===k&&x.lv===L))L--;return L}
function islePassed(p,k){const L=unlockLv(k),st=(p.start&&p.start[k])||1;return st>L||levelStatus(p,k,L).passed}
function isOpen(k){if(TESTER)return hasItems(k);if(!OPEN.includes(k)||!hasItems(k))return false;if(!me)return true;const q=seqIsles(),i=q.indexOf(k);return i<=0||(isOpen(q[i-1])&&islePassed(P(),q[i-1]))}
function nextIsle(){const q=seqIsles(),i=q.findIndex(k=>!isOpen(k));return i>0?{k:q[i],prev:q[i-1]}:null}
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);

/* ---------- round (logic unchanged) ---------- */
function startRound(k,l,fixCode){
  const p=P(); let pool;
  if(fixCode){pool=shuffle(ITEMS.filter(i=>i.c.includes(fixCode)&&!isS2(i.isl))).slice(0,3)}
  else{
    pool=shuffle(ITEMS.filter(i=>i.isl===k&&i.lv===l)).slice(0,ROUND);
    const review=p.wrong.map(id=>ITEMS.find(i=>i.id===id)).filter(i=>i&&i.isl===k&&!pool.includes(i));
    if(review.length&&pool.length>=ROUND){pool[ROUND-1]=review[Math.floor(Math.random()*review.length)];pool=shuffle(pool)}
  }
  S={...S,openN:openIsles().length,chal:!fixCode&&challengeIsle(p)===k,wasPassed:!fixCode&&levelStatus(p,k,l).passed,isl:k,lv:l,fix:fixCode||null,items:pool.map(it=>({it,ord:shuffle([0,1,2,3])})),i:0,ok:0,xp:0,coins:0,res:[]};
  question();
}

/* ---------- read aloud (Web Speech API) ---------- */
function sayMsg(t,sel){const m=$(sel||"#saymsg");if(m)m.textContent=t}
function getVoices(){return new Promise(res=>{let v=[];try{v=speechSynthesis.getVoices()}catch(e){}
  if(v.length)return res(v);let done=false;const fin=()=>{if(done)return;done=true;let w=[];try{w=speechSynthesis.getVoices()}catch(e){}res(w)};
  try{speechSynthesis.addEventListener("voiceschanged",fin,{once:true})}catch(e){}setTimeout(fin,1500)})}
function say(rate){const it=S.items[S.i].it;speak((it.ctx+". "+it.q).replace(/_+/g,"blank").replace(/\n/g,". "),rate||.85,"#saymsg")}
async function speak(text,rate,sel){
  if(!("speechSynthesis" in window)){sayMsg("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง ลองเปิดเกมใน Google Chrome หรือ Microsoft Edge",sel);return}
  sayMsg("กำลังโหลดเสียง…",sel);
  const voices=await getVoices();
  const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!voices.length){sayMsg("เครื่องนี้ยังไม่มีเสียงสำหรับอ่านออกเสียง ลองเปิดใน Google Chrome หรือติดตั้งเสียงภาษาอังกฤษในการตั้งค่าเครื่อง",sel);return}
  if(!en.length){sayMsg("เครื่องนี้ไม่มีเสียงภาษาอังกฤษ ติดตั้งได้ที่ การตั้งค่า > เวลาและภาษา > เสียงพูด (Speech)",sel);return}
  const voice=en.find(v=>/en-US/i.test(v.lang)&&/Google|Natural|Online/i.test(v.name))||en.find(v=>/en-US/i.test(v.lang))||en[0];
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=rate||.85;u.volume=1;
      u.onstart=()=>sayMsg("กำลังอ่าน…",sel);u.onend=()=>sayMsg("",sel);
      u.onerror=e=>sayMsg("อ่านออกเสียงไม่ได้ ("+(e.error||"error")+") ลองเปิดเกมใน Google Chrome",sel);
      try{speechSynthesis.resume()}catch(e){}
      speechSynthesis.speak(u);
      setTimeout(()=>{const m=$(sel);if(!speechSynthesis.speaking&&m&&/โหลด/.test(m.textContent))sayMsg("ไม่มีเสียงออก ลองเช็กว่าเปิดลำโพงอยู่ หรือเปิดเกมใน Google Chrome",sel)},2500);
    },120);
  }catch(e){sayMsg("อ่านออกเสียงไม่ได้ ลองเปิดเกมใน Google Chrome",sel)}
}

const TIER_W={gold:70,diamond:25,legend:5};
function pull(){
  const p=P(),left=HERO_KEYS.filter(k=>!p.heroes.includes(k));if(!left.length)return;
  if(p.tickets.free>0)p.tickets.free--;else if(p.pieces>=CFG.puzzle)p.pieces-=CFG.puzzle;else return;
  const byT=t=>left.filter(k=>HEROES[k].tier===t);

  else if(p.pityD>=2&&(byT("diamond").length||byT("legend").length))tier=byT("diamond").length&&Math.random()<.8?"diamond":(byT("legend").length?"legend":"diamond");
  else{const opts=Object.keys(TIER_W).filter(t=>byT(t).length),tot=opts.reduce((a,t)=>a+TIER_W[t],0);let r=Math.random()*tot;tier=opts.find(t=>(r-=TIER_W[t])<0)||opts[0]}
  let k=shuffle(byT(tier))[0];
  if(tier==="diamond"&&p.heroes.includes("ngo")&&byT("diamond").includes("phrasang")&&Math.random()<.5)k="phrasang";
  p.heroes.push(k);p.pulls=(p.pulls||0)+1;
  p.pityD=tier==="gold"?(p.pityD||0)+1:0;p.pityL=tier==="legend"?0:(p.pityL||0)+1;
  addEv("pull",k,tier);heroCard(k,true);flush();
}

function addStars(n){
  if(!me||n<=0)return 0;const p=P(),t=today();
  p.wd=p.wd&&p.wd.d===t?p.wd:{d:t,n:0};
  const cap=+CFG.daily_cap||30,g=Math.max(0,Math.min(n,cap-p.wd.n));p.wd.n+=g;
  const k=period().key;p.wh=p.wh||{};p.wh[k]=(p.wh[k]||0)+g;
  const ks=Object.keys(p.wh);if(ks.length>12)ks.slice(0,ks.length-12).forEach(x=>delete p.wh[x]);

}
function boardRows(list){
  const rows=(list||BOARD).map(b=>({id:b.id,name:b.name,char:b.char,wear:b.wear||{},xp:b.xp||0,wh:b.wh||{}}));
  if(me){const mine={id:me.id,name:me.name,char:myChar(),wear:myWear(),xp:P().xp,wh:P().wh||{},me:true};const i=rows.findIndex(r=>r.id===me.id);if(i>=0)rows[i]=mine;else rows.push(mine)}

function ranked(key,list){
  const rows=boardRows(list).map(r=>({...r,s:r.wh[key]||0}));
  rows.sort((a,b)=>b.s-a.s||b.xp-a.xp);
  rows.forEach(r=>r.place=1+rows.filter(x=>x.s>r.s).length);

function myPlace(key){const r=ranked(key).find(x=>x.me);return r?r.place:0}
function championIds(key,list){const rows=ranked(key,list),top=rows.length?rows[0].s:0;return top>0?rows.filter(r=>r.s===top).map(r=>r.id):[]}

/* rewards for the round that just ended: shown once, at the first log-in of the new round */
function weeklyClaims(){

      else if(mine.place<=3){p.pieces=(p.pieces||0)+1;lines.push(`<div class="rewrow">${TROPHY}<div><b>You were ${ord(mine.place)} last week!</b> <small class="tt">อันดับ ${mine.place} สัปดาห์ที่แล้ว</small><div class="note">+1 jigsaw piece</div></div></div>`)}

    ${s==="done"?`<g transform="translate(26,-70)"><circle r="13" fill="#5E9A2C"/><path d="M-6,0 l4,5 l8,-9" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`:""}
    <rect x="-70" y="18" width="140" height="26" rx="13" fill="#2B1B47" opacity=".75"/><text y="36" text-anchor="middle" font-family="Mitr,sans-serif" font-size="14" fill="#FFF6E0">${z.name}</text></g>`};
  const bs=bossOpen(p)?"open":"lock";
  return `<svg viewBox="0 0 820 470" class="hmap" role="group" aria-label="Himmapan map"><defs>
   <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1B47"/><stop offset=".55" stop-color="#5B3A8C"/><stop offset="1" stop-color="#1E7F86"/></linearGradient>
   <radialGradient id="hmoon"><stop offset="0" stop-color="#FFF7D1"/><stop offset="1" stop-color="#FFE48A" stop-opacity="0"/></radialGradient></defs>
   <rect width="820" height="470" fill="url(#hsky)"/>
   ${Array.from({length:40},(_,i)=>`<circle cx="${(i*197)%820}" cy="${(i*73)%200}" r="${i%3?1.4:2.2}" fill="#fff" opacity="${.4+(i%5)/10}"/>`).join("")}
   <circle cx="700" cy="70" r="70" fill="url(#hmoon)"/><circle cx="700" cy="70" r="30" fill="#FFF3C0"/>
   <path d="M0,330 q120,-40 240,-10 t260,0 t320,-20 v170 h-820z" fill="#14545A"/>
   <path d="M0,380 q160,-30 330,0 t490,-10 v100 h-820z" fill="#0F4048"/>
   ${spot(ZONES[0],150,250,`<path d="M-80,10 l50,-100 l26,40 l30,-70 l60,130z" fill="#6E5A9A"/><path d="M-30,-90 l12,24 l-24,0z M26,-130 l14,28 l-28,0z" fill="#fff" opacity=".8"/>`)}
   ${spot(ZONES[1],410,330,`<ellipse cx="0" cy="10" rx="96" ry="22" fill="#1E9E8F"/><path d="M-90,10 q30,-10 60,0 t60,0 t60,0" stroke="#9FF0E6" stroke-width="3" fill="none" opacity=".7"/>`)}
   ${spot(ZONES[2],670,260,`<ellipse cx="0" cy="10" rx="84" ry="20" fill="#E9A21F" opacity=".85"/><ellipse cx="0" cy="8" rx="64" ry="12" fill="#FFD84F" opacity=".7"/><path d="M-70,0 q-6,-24 6,-30 M70,0 q6,-24 -6,-30" stroke="#5E9A2C" stroke-width="5" fill="none"/>`)}
   <g class="hz ${bs}" data-k="BB" tabindex="0" role="button" aria-label="Boss Battle" transform="translate(410,150)">
    <path d="M-50,40 h100 v-40 l-10,-10 h-80 l-10,10z" fill="#C8553D"/><path d="M-40,-10 h80 l-40,-60z" fill="#F2B705"/><path d="M-6,-70 l6,-26 l6,26z" fill="#F2B705"/>
    <rect x="-14" y="10" width="28" height="30" rx="14" fill="#2B1B47"/>
    ${bs==="lock"?`<g transform="translate(-14,6)"><rect x="0" y="12" width="28" height="22" rx="5" fill="#5B4A7A"/><path d="M6,12 v-6 a8,8 0 0 1 16,0 v6" stroke="#5B4A7A" stroke-width="5" fill="none"/></g>`:`<circle cx="0" cy="24" r="8" fill="#FFC928"/>`}
    <rect x="-70" y="48" width="140" height="26" rx="13" fill="#2B1B47" opacity=".75"/><text y="66" text-anchor="middle" font-family="Mitr,sans-serif" font-size="14" fill="#FFF6E0">Boss Battle</text></g>
  </svg>`;
}

/* ---------- map card + unlock moment ---------- */
function himmapanCard(p){
  if(!s2On()||!ITEMS.some(x=>isS2(x.isl)))return "";
  const g=s2Gate(p);
  if(g.open)return `<button class="s2card open" onclick="himmapan()">${gateSVG(true,96)}<span><b>Himmapan Legends · Season 2</b><small class="tt">ดินแดนหิมพานต์ ซีซัน 2 · ระดับตำนาน</small><span class="note">${ZONES.filter(z=>zonePassed(p,z.k)).length}/3 zones passed · Tap to enter ▶</span></span></button>`;
  const a=Math.min(100,g.xpNow/g.xp*100),b=Math.min(100,g.passed/g.nI*100);
  return `<div class="s2card">${gateSVG(false,96)}<span><b>Himmapan Gate is locked</b><small class="tt">ประตูหิมพานต์ยังปิดอยู่ ทำอย่างใดอย่างหนึ่งเพื่อเปิด</small>
   <span class="s2bar"><i style="width:${a}%"></i></span><span class="note">Reach Navigator rank: ${g.xpNow}/${g.xp} XP <small class="tt">ได้ยศต้นหน</small></span>
   <span class="s2bar"><i style="width:${b}%"></i></span><span class="note">or pass ${g.nI} islands: ${g.passed}/${g.nI} <small class="tt">หรือผ่านเกาะครบ ${g.nI} เกาะ</small></span></span></div>`;
}
function s2Check(){
  if(!me)return;const p=P(),s=S2S(p);
  if(s.seen||!s2Gate(p).open||TESTER||!ITEMS.some(x=>isS2(x.isl)))return;
  s.seen=true;addEv("s2-gate","open",p.xp);flush();
  const o=document.createElement("div");o.id="bigb";o.className="bigb s2gate";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");
  o.innerHTML=`<div class="rays"></div><div class="bigin pop"><p class="bigt">SEASON 2 UNLOCKED!</p><p class="bigs">ประตูหิมพานต์เปิดแล้ว!</p>
   <div class="gatefly">${gateSVG(true,230)}</div>
   <p class="bigd">Three Mythic guardians are waiting: Garuda, Naga and the Golden Swan. Pass their Legend zones to meet them!<br><small class="tt">ผู้พิทักษ์ตำนาน 3 ตนรออยู่ ผ่านด่านระดับตำนานเพื่อพบพวกเขา</small></p>
   <div class="row" style="justify-content:center"><button class="btn gold" id="s2go" onclick="document.getElementById('bigb').remove();himmapan()">Enter Himmapan ▶ <small class="tt">เข้าสู่หิมพานต์</small></button><button class="btn ghost" onclick="document.getElementById('bigb').remove();SFX.tap()">Later <small class="tt">ไว้ทีหลัง</small></button></div></div>`;
  document.body.appendChild(o);SFX.chest();const b=$("#s2go");if(b)b.focus();
}

/* ---------- Himmapan screen ---------- */
function himmapan(){
  SCREEN="himmapan";header();const p=P();
  app.innerHTML=`<div class="frame pop s2f">
   <div class="subbar"><button class="btn sm ghost" onclick="map()">◀ Map <small class="tt">แผนที่</small></button><h2>Himmapan Legends <small>ดินแดนหิมพานต์ · ซีซัน 2</small></h2></div>
   <div class="mapsvg" id="hmap">${himmapanScene(p)}</div>
   <div class="pad col"><p class="hint">Level 4 · Legend questions are like the real O-NET test: longer texts, two blanks and more thinking.<br><small class="tt">ข้อระดับตำนานคล้ายข้อสอบ O-NET จริง: ข้อความยาวขึ้น เติม 2 ช่อง และต้องคิดหลายขั้น</small></p>
   <div class="zlist">${ZONES.map(z=>{const ok=zoneOpen(p,z),done=zonePassed(p,z.k),bst=stat(p,z.k,4).best;
     return `<button class="zcard ${ok||done?"":"locked"}" style="--zc:${z.c}" onclick="zone('${z.k}')">${guardSVG(z.g,64)}<span><b>${z.name}</b> <small class="tt">${z.th}</small><span class="note">${z.std}</span>
      <span class="note">${done?"Passed ✓ Mythic guardian met (ผ่านแล้ว)":ok?`Best ${starStr(bst)}`:`${ICON.lock} Pass Level 3 of ${z.need.map(k=>placeInfo(k).name).join(" and ")} (ผ่านระดับ 3 ของ ${z.need.map(k=>placeInfo(k).th).join(" และ ")})`}</span></span></button>`}).join("")}
     <button class="zcard boss ${bossOpen(p)?"":"locked"}" onclick="bossPage()"><span class="bossic">${TROPHY}</span><span><b>Boss Battle</b> <small class="tt">ศึกตำนาน · ข้อสอบจำลอง O-NET 32 ข้อ</small><span class="note">${bossOpen(p)?`Best score: ${S2S(p).best}/32`:`${ICON.lock} Pass all 3 zones first (ผ่านครบ 3 โซนก่อน)`}</span></span></button></div></div></div>`;
  document.querySelectorAll("#hmap .hz").forEach(el=>{const go=()=>{const k=el.dataset.k;k==="BB"?bossPage():zone(k)};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});
}
function zone(k){
  const z=ZONES.find(x=>x.k===k),p=P();
  if(!zoneOpen(p,z)){SFX.lock();alertBox(`Pass Level 3 of ${z.need.map(x=>placeInfo(x).name).join(" and ")} to open ${z.name}. (ผ่านระดับ 3 ของ ${z.need.map(x=>placeInfo(x).th).join(" และ ")} เพื่อเปิด${z.th})`);return}
  SCREEN="zone";header();CUR=k;S={isl:k,goal:"5"};
  const s=levelStatus(p,k,4),done=zonePassed(p,k);
  app.innerHTML=`<div class="frame pop s2f">
   <div class="subbar"><button class="btn sm ghost" onclick="himmapan()">◀ Himmapan <small class="tt">หิมพานต์</small></button><h2>${z.name} <small>${z.th}</small></h2></div>
   <div class="banner s2b" style="--zc:${z.c}"><div class="bisle">${guardSVG(z.g,170)}</div>
     <div class="npc"><div class="bubble"><p class="en">${esc(z.en)}</p><p class="thx">${esc(z.tth)}</p>
     <div class="lrow"><button class="listen sm" onclick="speak(ZONES.find(x=>x.k==='${k}').en,.85,'#npcmsg')">${ICON.speaker} Listen <small>ฟัง</small></button><span id="npcmsg" class="note" aria-live="polite"></span></div></div></div></div>
   <div class="pad col"><div class="std">${z.std}</div>
     <div class="chal" style="background:#F1E3FF;border-color:#B266FF;color:#4A2A7A">${ICON.star} <b>${done?`You met the ${z.gn}!`:`Pass this zone to meet the Mythic ${z.gn}.`}</b> <small class="tt">${done?`พบ${z.gth}แล้ว`:`ผ่านโซนนี้ (80% ใน 2 รอบล่าสุด) เพื่อพบ${z.gth}`}</small></div>
     <div class="goalbox"><b>${ICON.target} Set your goal <small>เป้าหมายรอบนี้</small></b>
       <div class="goal" id="goal">${[["4","4 correct",1],["5","5 correct",2],["6","All 6 correct",3]].map(([v,t,n])=>`<button class="chip ${v==="5"?"on":""}" data-v="${v}" onclick="setGoal(this)"><span class="stars">${"★".repeat(n)}</span> ${t}</button>`).join("")}</div></div>
     <div class="levels"><button class="lvl legend ${s.passed?"on":""}" onclick="SFX.tap();startRound('${k}',4)">
       <h3>${LV[4]} <small>${LVTH[4]}</small></h3><span class="stars">${starStr(s.best)}</span>
       <span class="note">${s.passed?"Passed ✓ (ผ่านแล้ว)":s.played?`Played ${s.played} · Need 80% in the last 2 rounds (ต้องได้ 80% ใน 2 รอบล่าสุด)`:"Ready to play (พร้อมเล่น)"}</span></button></div></div></div>`;
}

/* ---------- Boss Battle: mock O-NET, once a week ---------- */
function bossPage(){
  const p=P(),s=S2S(p);
  if(!bossOpen(p)){SFX.lock();alertBox("Pass all 3 Legend zones first. (ผ่านครบ 3 โซนตำนานก่อน)");return}
  SCREEN="boss";header();const wk=period().key,done=s.boss[wk]!==undefined&&!TESTER,pass=+CFG.s2_boss||24;
  app.innerHTML=`<div class="frame pop s2f">
   <div class="subbar"><button class="btn sm ghost" onclick="himmapan()">◀ Himmapan <small class="tt">หิมพานต์</small></button><h2>Boss Battle <small>ศึกตำนาน</small></h2></div>
   <div class="pad col" style="align-items:center;text-align:center">
    <div class="row" style="justify-content:center;gap:4px">${ZONES.map(z=>guardSVG(z.g,90)).join("")}</div>
    <h3>Mock O-NET Test · 32 questions <small class="tt">ข้อสอบจำลอง O-NET 32 ข้อ ตามผังข้อสอบจริง</small></h3>
    <p>Answer each question once. No hints. You will see your score for each skill at the end.<br><small class="tt">ตอบข้อละ 1 ครั้ง ไม่มีคำใบ้ เห็นคะแนนแยกตามทักษะตอนท้าย · ใช้เวลาประมาณ 40 นาที</small></p>
    <div class="chal">${TROPHY} <b>Score ${pass} or more to win 3 jigsaw pieces and the Legend Champion title!</b> <small class="tt">ได้ ${pass} ข้อขึ้นไป รับจิ๊กซอว์ 3 ชิ้น และฉายาแชมป์ตำนาน</small></div>
    <p class="note">You can take the Boss Battle once a week. Best score: ${s.best}/32 <small class="tt">สู้บอสได้สัปดาห์ละ 1 ครั้ง</small></p>
    ${done?`<div class="msg ok">This week's score: <b>${s.boss[wk]}/32</b>. Come back next week! <small class="tt">สัปดาห์นี้สู้แล้ว กลับมาสัปดาห์หน้านะ</small></div>`:`<button class="btn gold" onclick="startBoss()">Start the Boss Battle ▶ <small class="tt">เริ่มศึกตำนาน</small></button>`}</div></div>`;
}
function startBoss(){
  const pool=ITEMS.filter(i=>i.isl==="BB");if(!pool.length)return;
  S={isl:"BB",lv:4,exam:true,fix:null,goal:"0",items:pool.map(it=>({it,ord:shuffle([0,1,2,3])})),i:0,ok:0,xp:0,coins:0,res:[],pick:[],openN:openIsles().length};
  addEv("boss","start",period().key);question();
}
function examAnswer(o,btn){
  const q=S.items[S.i],it=q.it,correct=o===0;
  addLog({t:Date.now(),id:it.id,isl:it.isl,lv:it.lv,ans:"ABCD"[q.ord.indexOf(o)],ok:correct,code:it.c[o],try:1,ms:Date.now()-S.qt,fix:false});
  S.res[S.i]=correct;S.pick[S.i]=o;if(correct){S.ok++;S.xp+=10}
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b===btn)b.classList.add("picked")});SFX.tap();
  $("#fb").innerHTML=`<div class="fb pop" style="background:#5B3A8C"><b>Answer saved</b><span class="tag">บันทึกคำตอบแล้ว</span></div><div class="next"><button class="btn" onclick="nextQ()">${S.i<S.items.length-1?"Next ▶":"See results ▶"}</button></div>`;
}
const STD_EN={"ต1.1":"Signs and reading","ต1.2":"Dialogues","ต1.3":"Tables, charts and opinions","ต2.1":"Festivals","ต2.2":"Sentences and culture","ต4.1":"English at school"};
function bossResults(){
  SCREEN="results";const p=P(),s=S2S(p),n=S.items.length,pass=+CFG.s2_boss||24,wk=period().key,win=S.ok>=pass;
  const by={};S.items.forEach((q,j)=>{const k=String(q.it.std).replace(/\s/g,"");by[k]=by[k]||{n:0,ok:0};by[k].n++;if(S.res[j])by[k].ok++});
  const first=!(s.best>=pass);
  p.xp+=S.xp;s.best=Math.max(s.best,S.ok);if(!TESTER)s.boss[wk]=S.ok;
  let pcs=0;if(win){pcs=3;s.wins++;p.pieces=(p.pieces||0)+pcs;if(!p.badges.includes("legend"))p.badges.push("legend")}
  addEv("boss","score",S.ok);if(pcs)addEv("pieces","boss",pcs);
  const wsGot=addStars(Math.round(S.ok/4));
  const wrong=S.items.map((q,j)=>({q,j})).filter(x=>!S.res[x.j]);
  header();
  app.innerHTML=`<div class="frame pop s2f"><div class="subbar"><h2>Boss Battle complete! <small>ศึกตำนานจบแล้ว</small></h2></div>
   <div class="pad col" style="align-items:center;text-align:center">
    <div class="row" style="justify-content:center">${ZONES.map(z=>guardSVG(z.g,80)).join("")}</div>
    <div class="bossscore">${S.ok}<small>/${n}</small></div>
    <div class="msg ${win?"ok":"no"}">${win?`${TROPHY} <b>Legend Champion!</b> +3 jigsaw pieces <small class="tt">แชมป์ตำนาน ได้จิ๊กซอว์ 3 ชิ้น</small>`:`So close! You need ${pass} to win. Practise in the zones and come back next week. <small class="tt">ต้องได้ ${pass} ข้อ ฝึกในโซนตำนานแล้วกลับมาสัปดาห์หน้า</small>`}</div>
    <div class="tablewrap" style="width:100%"><table><thead><tr><th>Skill (ทักษะ)</th><th>Score</th></tr></thead><tbody>${Object.keys(by).sort().map(k=>`<tr><td>${k} ${STD_EN[k]||""}</td><td><b>${by[k].ok}/${by[k].n}</b> <span class="s2bar sm"><i style="width:${100*by[k].ok/by[k].n}%"></i></span></td></tr>`).join("")}</tbody></table></div>
    <div class="note">+${S.xp} XP · Weekly stars +${wsGot}</div>
    ${wrong.length?`<details class="card" style="width:100%;text-align:left"><summary><b>Check the questions you missed (${wrong.length})</b> <small class="tt">ดูข้อที่ตอบผิด</small></summary>${wrong.map(({q,j})=>`<div class="rv"><b>${j+1}.</b> ${esc(q.it.q)}<div class="note">Your answer: ${esc(q.it.o[S.pick[j]])} · <b>Correct: ${esc(q.it.o[0])}</b></div>${q.it.th[0]?`<div class="note">${ICON.bulb} ${esc(q.it.th[0])}</div>`:""}</div>`).join("")}</details>`:""}
    <div class="row"><button class="btn ghost" onclick="himmapan()">Himmapan <small class="tt">หิมพานต์</small></button><button class="btn ghost" onclick="map()">Map <small class="tt">แผนที่</small></button></div></div></div>`;
  if(win){SFX.chest();}else SFX.tap();
  flush();
}
function s2Teacher(players){
  if(!ITEMS.some(x=>isS2(x.isl)))return "";
  const rows=players.map(pl=>{const p=Object.assign(blankState(),pl.state||{});p.start=pl.start;const s=Object.assign({best:0,wins:0,boss:{}},p.s2||{}),g=s2GateT(p);
    return `<tr><td>${esc(pl.id)} <span class="note">${esc(pl.name)}</span></td><td>${g?"เปิดแล้ว":"ยังไม่เปิด"}</td>${ZONES.map(z=>{const st=stat(p,z.k,4),acc=st.last.length?Math.round(100*st.last.reduce((a,b)=>a+b,0)/st.last.length)+"%":"–";return `<td>${zonePassed(p,z.k)?"ผ่าน ✓":st.played?`เล่น ${st.played} รอบ · ${acc}`:"–"}</td>`}).join("")}<td>${s.best}/32 · ชนะ ${s.wins}</td></tr>`}).join("");
  return `<div class="card col" style="gap:8px"><b>Season 2 หิมพานต์ (ระดับ 4 ตำนาน · คำตอบบันทึกในแท็บ "บันทึกคำตอบ S2" แยกจากข้อมูลวิจัย)</b>
   <div class="tablewrap"><table><thead><tr><th>นักเรียน</th><th>ประตู</th>${ZONES.map(z=>`<th>${z.name}</th>`).join("")}<th>Boss (คะแนนสูงสุด)</th></tr></thead><tbody>${rows}</tbody></table></div>
   <span class="note">สถานะ: ${CFG.season2?"เปิด Season 2 แล้ว":"ยังปิด (นักเรียนยังไม่เห็น) — เปิดโดยแก้ season2 = TRUE ในแท็บ ตั้งค่า"} · เปิดประตูเมื่อ XP ≥ ${+CFG.s2_xp||900} หรือผ่าน ${+CFG.s2_isles||3} เกาะ · โซนเปิดเมื่อผ่านระดับ 3 ของ 2 เกาะที่เกี่ยวข้อง · Boss ผ่านเมื่อได้ ≥ ${+CFG.s2_boss||24}/32 สัปดาห์ละ 1 ครั้ง</span></div>`;
}
function s2GateT(p){const xp=+CFG.s2_xp||900,nI=+CFG.s2_isles||3,passed=ISLANDS.filter(i=>hasItems(i.k)&&islePassed(p,i.k)).length;return !!CFG.season2&&(p.xp>=xp||passed>=nI)}

/* S2-END */
boot();
</script>
